services:
  tenderpilot:
    build: .
    container_name: tenderpilot
    restart: unless-stopped
    ports:
      # внешний порт можно менять: PORT=8080 docker compose up -d
      - "${PORT:-8000}:8000"
    environment:
      # адрес, который подставляется в ссылки уведомлений
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8000}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/registration', timeout=5).status==200 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      # база данных и папка с выгрузками живут на хосте — не теряются при обновлении
      - ./data:/app/data
      - ./inbox:/app/inbox
